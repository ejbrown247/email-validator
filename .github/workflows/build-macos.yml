
name: Build macOS apps

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: intel

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest -v test_validator

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --name EmailValidator --collect-all email_validator app.py

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/EmailValidator.app EmailValidator-${{ matrix.architecture }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EmailValidator-${{ matrix.architecture }}
          path: EmailValidator-${{ matrix.architecture }}.zip
